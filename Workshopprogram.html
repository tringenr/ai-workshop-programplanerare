<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workshopprogram</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#f2eae4;color:#35212d}
.bar{height:64px;display:flex;align-items:center;gap:12px;padding:10px 18px;background:#fff;border-bottom:1px solid #e8d6dc;box-shadow:0 2px 8px rgba(53,33,45,.08);position:relative;z-index:2}
.bar strong{font-size:15px}.bar select{min-width:min(470px,65vw);padding:10px 12px;border:1px solid #d9aac8;border-radius:9px;background:#fff;color:#35212d;font-size:15px}
iframe{display:block;width:100%;height:calc(100% - 64px);border:0;background:#fff}
@media(max-width:700px){.bar{height:auto;min-height:64px;align-items:stretch;flex-direction:column;gap:6px}.bar select{min-width:0;width:100%}iframe{height:calc(100% - 92px)}}
</style>
</head>
<body>
<div class="bar"><strong>Välj program</strong>
<select id="program">
<option value="AI-organisationspsykologens-vardag.html">AI i organisationspsykologens vardag</option>
<option value="Halvdag-ledningsgruppen.html">Halvdag med ledningsgruppen</option>
<option value="2-okt-konflikt-ws-molndal.html">2 okt konflikt-ws Mölndal</option>
</select></div>
<iframe id="view" title="Program" src="AI-organisationspsykologens-vardag.html"></iframe>
<script>
const select=document.getElementById('program'),view=document.getElementById('view');
const q=new URLSearchParams(location.search).get('program');
if(q&&[...select.options].some(o=>o.value===q)){select.value=q;view.src=q}
select.addEventListener('change',()=>{view.src=select.value;history.replaceState(null,'','?program='+encodeURIComponent(select.value))});
</script>
<style id="program-switcher-2-oct">#program-switcher-box{position:fixed;right:18px;top:18px;z-index:99999;display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid #ead8d5;border-radius:12px;background:rgba(255,255,255,.97);box-shadow:0 8px 24px rgba(91,44,60,.14);font-family:Montserrat,Arial,sans-serif;color:#35212d}#program-switcher-box label{font-size:12px;font-weight:700}#program-switcher-box select{border:1px solid #d9c5c2;border-radius:8px;background:#fff;color:#35212d;padding:7px 28px 7px 9px;font:600 13px Montserrat,Arial,sans-serif}@media(max-width:700px){#program-switcher-box{left:10px;right:10px;top:10px;justify-content:space-between}#program-switcher-box select{max-width:68vw}}</style><div id="program-switcher-box"><label for="program-switcher-select">Program</label><select id="program-switcher-select"><option value="Workshopprogram.html">AI-workshop</option><option value="2-okt-konflikt-ws-molndal.html">2 okt konflikt-ws Mölndal</option></select></div><script>(function(){const s=document.getElementById('program-switcher-select');if(s)s.addEventListener('change',function(){location.href=this.value})})();</script></body></html>
