name: Add program selector

on:
  push:
    paths:
      - ".github/workflows/add-program-selector.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject program selector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("Workshopprogram.html")
          s = p.read_text(encoding="utf-8")
          marker = "program-switcher-2-oct"
          if marker in s:
              print("Selector already present")
              raise SystemExit(0)

          inject = r'''
          <style id="program-switcher-2-oct">
            #program-switcher-box{
              position:fixed;right:18px;top:18px;z-index:99999;
              display:flex;align-items:center;gap:8px;
              padding:10px 12px;border:1px solid #ead8d5;border-radius:12px;
              background:rgba(255,255,255,.96);box-shadow:0 8px 24px rgba(91,44,60,.14);
              font-family:Montserrat,Arial,sans-serif;color:#35212d
            }
            #program-switcher-box label{font-size:12px;font-weight:700}
            #program-switcher-box select{
              border:1px solid #d9c5c2;border-radius:8px;background:#fff;color:#35212d;
              padding:7px 28px 7px 9px;font:600 13px Montserrat,Arial,sans-serif
            }
            @media(max-width:700px){
              #program-switcher-box{left:10px;right:10px;top:10px;justify-content:space-between}
              #program-switcher-box select{max-width:68vw}
            }
          </style>
          <div id="program-switcher-box" aria-label="Välj program">
            <label for="program-switcher-select">Program</label>
            <select id="program-switcher-select">
              <option value="Workshopprogram.html">AI-workshop</option>
              <option value="2-okt-konflikt-ws-molndal.html">2 okt konflikt-ws Mölndal</option>
            </select>
          </div>
          <script>
          (function(){
            const sel=document.getElementById('program-switcher-select');
            if(!sel)return;
            sel.addEventListener('change',function(){
              window.location.href=this.value;
            });
          })();
          </script>
          '''
          if "</body>" not in s:
              raise SystemExit("Could not find </body>")
          s = s.replace("</body>", inject + "
</body>", 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit patched planner
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Workshopprogram.html
          git commit -m "Add program selector to planner"
          git push
