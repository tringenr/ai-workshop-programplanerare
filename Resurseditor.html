<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redigera resurser</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Raleway:wght@500;600&display=swap" rel="stylesheet"><style>
:root{font-family:Raleway,Arial,sans-serif;color:#35212d;background:#f8eee9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 82% 10%,#fde1ec,transparent 27%),linear-gradient(135deg,#fffaf6,#f8ece5)}main{max-width:1120px;margin:auto;padding:42px 28px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}h1{margin:0;font:700 clamp(30px,4vw,50px)/1 Montserrat,Arial,sans-serif;letter-spacing:-.05em}.actions{display:flex;gap:9px;flex-wrap:wrap}button,.action{border:1px solid #dfbfd0;border-radius:10px;background:#fff;color:#765e6b;padding:10px 13px;font:700 14px Montserrat,Arial,sans-serif;cursor:pointer;text-decoration:none}.primary{background:#bf348e;border-color:#bf348e;color:#fff}.section{margin-top:32px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px}.section h2{font:700 24px Montserrat,Arial,sans-serif}.list{display:grid;gap:12px}.item{display:grid;grid-template-columns:1.2fr 2fr 2fr 90px 36px 36px;gap:9px;align-items:center;padding:12px;border:1px solid #ead8d5;border-radius:15px;background:#fff}.item input{width:100%;min-width:0;border:1px solid #ddcfd0;border-radius:8px;padding:9px;font:14px Raleway,Arial,sans-serif}.item input[type=color]{height:38px;padding:3px}.small{width:36px;height:36px;padding:0}.hint{margin:0;color:#765e6b;line-height:1.45}.file{display:none}@media(max-width:820px){.item{grid-template-columns:1fr 1fr}.item input:nth-child(3){grid-column:span 2}.item input:nth-child(4){width:90px}header{align-items:flex-start;flex-direction:column}}@media(max-width:500px){main{padding:28px 16px}.item{grid-template-columns:1fr}.item input:nth-child(3){grid-column:auto}}
</style></head><body><main><header><div><h1>Redigera resurser</h1><p class="hint">Ändringarna sparas i den här webbläsaren. Hämta sedan uppdateringsfilen när du vill publicera en ny version.</p></div><div class="actions"><a class="action" href="Resurser.html" target="_blank">Visa sidan ↗</a><button id="import" type="button">Importera</button><button id="export" type="button" class="primary">Hämta uppdateringsfil</button><input id="file" class="file" type="file" accept="application/json"></div></header><section class="section"><div class="section-head"><h2>AI-verktyg</h2><button type="button" data-add="tools">+ Lägg till</button></div><div id="tools" class="list"></div></section><section class="section"><div class="section-head"><h2>Mina appar</h2><button type="button" data-add="apps">+ Lägg till</button></div><p class="hint">Bildfältet kan innehålla en bildlänk eller en sökväg i projektet, exempelvis <code>assets/min-bild.png</code>.</p><div id="apps" class="list"></div></section></main><script>
const initial={tools:[],apps:[]},key='workshop-resource-editor-v1';let data;const get=id=>document.getElementById(id);function save(){localStorage.setItem(key,JSON.stringify(data))}function esc(value=''){return String(value).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}function render(type){const list=get(type);list.innerHTML='';data[type].forEach((item,index)=>{const row=document.createElement('div');row.className='item';const isTool=type==='tools';row.innerHTML=`<input data-field="name" value="${esc(item.name)}" placeholder="Namn"><input data-field="description" value="${esc(item.description)}" placeholder="Kort beskrivning"><input data-field="url" value="${esc(item.url)}" placeholder="https://..."><input data-field="${isTool?'mark':'image'}" value="${esc(isTool?item.mark:item.image||'')}" placeholder="${isTool?'Symbol eller text':'Bildlänk'}"><input data-field="accent" type="color" value="${esc(item.accent||'#bf348e')}"><button class="small" data-move="up" title="Flytta upp">↑</button><button class="small" data-move="down" title="Flytta ned">↓</button><button class="small" data-delete title="Ta bort">×</button>`;row.querySelectorAll('input').forEach(input=>input.oninput=()=>{item[input.dataset.field]=input.value;save()});row.querySelector('[data-delete]').onclick=()=>{data[type].splice(index,1);save();render(type)};row.querySelector('[data-move="up"]').onclick=()=>{if(index){[data[type][index-1],data[type][index]]=[data[type][index],data[type][index-1]];save();render(type)}};row.querySelector('[data-move="down"]').onclick=()=>{if(index<data[type].length-1){[data[type][index+1],data[type][index]]=[data[type][index],data[type][index+1]];save();render(type)}};list.append(row)})}function renderAll(){render('tools');render('apps')}async function load(){try{data=JSON.parse(localStorage.getItem(key)||'')}catch{}if(!data?.tools||!data?.apps){data=await fetch('resources.json').then(r=>r.json()).catch(()=>initial);save()}renderAll()}document.querySelectorAll('[data-add]').forEach(button=>button.onclick=()=>{const type=button.dataset.add;data[type].push({name:'Nytt '+(type==='tools'?'verktyg':'app'),description:'Kort beskrivning.',url:'https://',mark:'●',image:'',accent:'#bf348e'});save();render(type)});get('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='resources.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};get('import').onclick=()=>get('file').click();get('file').onchange=async event=>{try{const imported=JSON.parse(await event.target.files[0].text());if(!Array.isArray(imported.tools)||!Array.isArray(imported.apps))throw Error();data=imported;save();renderAll()}catch{alert('Filen behöver innehålla listorna tools och apps.')}};load();
</script></body></html>
