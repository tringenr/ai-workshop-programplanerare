<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kom igång med Gamma</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Raleway:wght@500;600&display=swap" rel="stylesheet"><style>:root{font-family:Raleway,Arial,sans-serif;color:#35212d;background:#f8eee9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 10%,#dfd7ff,transparent 30%),linear-gradient(135deg,#fffaf6,#f8ece5)}main{width:min(940px,100%);padding:clamp(28px,5vw,62px);border:1px solid #ead8d5;border-radius:28px;background:#fff;box-shadow:0 20px 45px #5b2c3c18}header{display:flex;justify-content:space-between;gap:20px;align-items:start}h1{margin:0;font:700 clamp(32px,5vw,60px)/1 Montserrat,Arial,sans-serif;letter-spacing:-.06em}p{line-height:1.5;color:#765e6b}.count{color:#8063ee;font:700 14px Montserrat,Arial,sans-serif}.step{display:grid;grid-template-columns:70px 1fr;gap:18px;margin:42px 0 26px}.number{width:54px;height:54px;display:grid;place-items:center;border-radius:50%;background:#8063ee;color:#fff;font:700 20px Montserrat,Arial,sans-serif}.step h2{margin:0 0 8px;font:700 clamp(24px,3vw,36px)/1.1 Montserrat,Arial,sans-serif}.example{margin-top:16px;padding:16px;border-radius:13px;background:#f3f0ff;color:#4d4180;line-height:1.45}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:38px}.button{border:1px solid #d7cff7;border-radius:10px;background:#fff;color:#5d4ea5;padding:11px 15px;font:700 15px Montserrat,Arial,sans-serif;text-decoration:none;cursor:pointer}.button.primary{background:#8063ee;border-color:#8063ee;color:#fff}@media(max-width:560px){header{display:block}.step{grid-template-columns:1fr}.actions{flex-wrap:wrap}}</style></head><body><main><header><div><div class="count" id="count">Steg 1 av 4</div><h1 id="title">Starta ett nytt projekt</h1></div><a class="button" href="Resurser.html">← Resurser</a></header><section class="step"><div class="number" id="number">1</div><div><p id="copy"></p><div class="example" id="example"></div></div></section><div class="actions"><button class="button" id="back" disabled>← Tillbaka</button><button class="button primary" id="next">Nästa →</button><a class="button primary" id="open" href="https://gamma.app/" target="_blank" rel="noopener noreferrer" hidden>Öppna Gamma ↗</a></div></main><script>const steps=[['Starta ett nytt projekt','Logga in i Gamma och välj “Create new AI” från startsidan. Du kan skapa en presentation, ett dokument eller en enkel webbsida.','Börja med ett verkligt workshopuppdrag, till exempel: “Introduktion till svåra samtal för nya chefer”.'],['Välj en väg in','Välj Generate när du vill att Gamma ska göra ett första utkast, Paste när du redan har text och Import när du vill börja med en PowerPoint, ett dokument eller en länk.','För ett befintligt utbildningsmaterial: välj Import. För en ny idé: välj Generate.'],['Ge Gamma en tydlig riktning','Skriv ämne, målgrupp, syfte, omfattning och önskad ton. Be gärna först om en disposition som du kan granska innan hela presentationen skapas.','“Skapa en disposition till ett 20-minuters pass för chefer om återhämtning. Praktisk, forskningsnära ton. Fem delar och en reflektionsfråga.”'],['Granska och förädla','Läs alltid igenom innehåll och bilder. Ändra text direkt eller använd AI-redigering för en vald sida. Justera tema och bildval innan du delar eller presenterar.','Fråga: “Vilka två påståenden behöver jag faktagranska innan presentationen används?”']];let i=0;const $=id=>document.getElementById(id);function render(){const s=steps[i];$('count').textContent=`Steg ${i+1} av ${steps.length}`;$('title').textContent=s[0];$('copy').textContent=s[1];$('example').textContent=s[2];$('number').textContent=i+1;$('back').disabled=i===0;$('next').hidden=i===steps.length-1;$('open').hidden=i!==steps.length-1}$('back').onclick=()=>{if(i){i--;render()}};$('next').onclick=()=>{if(i<steps.length-1){i++;render()}};render();</script></body></html>
