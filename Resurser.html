<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Raleway:wght@500;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f8eee9;color:#35212d;font-family:Raleway,Arial}main{max-width:1600px;margin:auto;padding:35px 6%}.tabs{display:flex;justify-content:center;gap:8px;margin-bottom:32px}button,a{padding:10px 15px;border:1px solid #dfbfd0;border-radius:10px;background:#fff;color:#765e6b;font:700 14px Montserrat,Arial;cursor:pointer;text-decoration:none}.tabs button{border-radius:999px}.tabs button[aria-selected=true],.primary{background:#bf348e;border-color:#bf348e;color:#fff}h1{text-align:center;font:700 clamp(34px,5vw,60px)/1 Montserrat;margin:0 0 32px}.panel[hidden]{display:none}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{min-height:220px;padding:18px;border:1px solid #ead8d5;border-radius:22px;background:#fff;box-shadow:0 10px 26px #5b2c3c14}.thumb{height:110px;display:grid;place-items:center;border-radius:15px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 42%,white));color:#fff;font:700 27px Montserrat;text-align:center}.thumb:after{content:"";position:absolute;width:130px;height:130px;border:1px solid #ffffffa6;border-radius:50%;right:-42px;bottom:-64px}.thumb b,.thumb img{position:relative;z-index:1}.thumb b{display:grid;place-items:center}.tool-logo{width:58px!important;height:58px!important;object-fit:contain!important;border-radius:14px;padding:7px;background:#fff;box-shadow:0 6px 18px #35212d26}.thumb img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}.app-thumb{background:#f2eae4}.planner-art{position:relative;background:linear-gradient(135deg,#bf348e,#f24b78 52%,#f29441)}.planner-art:before{content:"";position:absolute;inset:14% 16%;border-radius:12px;background:rgba(255,255,255,.94);box-shadow:0 12px 26px rgba(53,33,45,.28)}.planner-art:after{content:"";position:absolute;left:27%;right:27%;top:29%;height:8px;border-radius:8px;background:#bf348e;box-shadow:0 26px 0 #f29441,0 52px 0 #f24b78}.openai .thumb b{width:55px;height:55px;border-radius:15px;background:#fff;color:#171717;font-size:34px}.eleven .thumb b{background:#fff;color:#111;border-radius:14px;padding:10px 13px}.card h2{font:700 24px Montserrat;margin:16px 0 8px}.card p{color:#765e6b;min-height:40px}.actions{display:flex;gap:8px}.open{background:var(--c);color:#fff;border-color:var(--c)}dialog{width:min(1120px,94vw);height:min(760px,90vh);border:0;border-radius:24px;padding:0;box-shadow:0 30px 90px #21121a66}dialog::backdrop{background:#35212d99}.head{display:flex;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #eee2df;font:700 18px Montserrat}.body{display:grid;grid-template-columns:1fr 280px;gap:22px;padding:22px;height:calc(100% - 65px)}.browser{overflow:hidden;border:1px solid #d8d4d0;border-radius:15px;background:#fff}.bar{padding:12px;background:#f0efee;color:#777;font-size:11px}.screen{height:calc(100% - 40px);display:grid;place-items:center;padding:40px;text-align:center}.mock{width:80%;padding:34px;border-radius:14px;background:#fff;box-shadow:0 10px 30px #18253a22;white-space:pre-line}.side{display:flex;flex-direction:column;justify-content:space-between}.side h2{font:700 28px/1 Montserrat}.bubble{padding:16px;border-radius:14px;background:#fce1ea;color:#57213e}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{display:none}.nav a.last{display:inline-block}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.body{grid-template-columns:1fr;overflow:auto}.browser{min-height:340px}}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style><body><main><nav class="tabs"><button aria-selected="true">AI-verktyg</button><button aria-selected="false">Mina appar</button></nav><section id="tools" class="panel"><h1>AI-verktyg</h1><div class="grid"></div></section><section id="apps" class="panel" hidden><h1>Mina appar</h1><div class="grid"></div></section></main><dialog id="tour"><div class="head"><span id="count"></span><button id="close">×</button></div><div class="body"><div class="browser"><div class="bar">notebooklm.google.com</div><div class="screen"><div class="mock" id="mock"></div></div></div><div class="side"><div><h2 id="title"></h2><p id="copy"></p><div class="bubble" id="bubble"></div></div><div class="nav"><button id="back">← Tillbaka</button><button class="primary" id="next">Nästa →</button><a id="open" class="primary" target="_blank">Öppna ↗</a></div></div></div></dialog><script>
const data={"tools":[["ChatGPT","Idéer, utkast, analys och återkoppling.","https://chatgpt.com/","#18a989","◎","https://www.google.com/s2/favicons?domain=chatgpt.com&sz=128"],["Claude","Resonera, skriva och arbeta med längre underlag.","https://claude.ai/","#df7e5d","Claude","https://www.google.com/s2/favicons?domain=claude.ai&sz=128"],["Gamma","Skapa presentationer och visuella berättelser.","https://gamma.app/","#8063ee","G","https://www.google.com/s2/favicons?domain=gamma.app&sz=128"],["NotebookLM","Utforska egna källor, dokument och frågor.","https://notebooklm.google.com/","#2b78d0","NotebookLM","https://www.google.com/s2/favicons?domain=notebooklm.google.com&sz=128"],["Consensus","Sök och orientera dig i forskning.","https://consensus.app/","#c53591","⌁","https://www.google.com/s2/favicons?domain=consensus.app&sz=128"],["ElevenLabs","Röst, tal och ljud från text.","https://elevenlabs.io/","#161616","Ⅱ",""],["Lovable","Skapa enkla digitala lösningar genom dialog.","https://lovable.dev/","#ff6945","♥",""]],"apps":[["Programplaneraren","Planera, visa och samla material för en workshop.","https://tringenr.github.io/ai-workshop-programplanerare/Workshopprogram.html","#bf348e","","planner"],["Skolplanering","Synkade kalendrar och planeringar för barnens skolgång.","https://tringenr.github.io/Skolplanering/","#18a989","assets/skolplanering-thumb.png",""],["Bokhyllan","En egen app för att utforska och organisera böcker.","https://tringenr.github.io/bokhyllan/","#bf348e","assets/bokhyllan-thumb.png",""],["Bilkalkylen","En enkel kalkyl för att jämföra bilkostnader.","https://tringenr.github.io/bilkalkylen/","#f29441","assets/bilkalkylen-thumb.png",""],["Beteendeguide","Lära sig TBA","https://tringenr.github.io/beteendeguide/","#bf348e","",""],["Hitta pass","Kort beskrivning.","https://nordic-pass-finder.lovable.app/","#bf348e","",""],["Boka möten","Kort beskrivning.","https://easy-time-share.lovable.app","#bf348e","",""]]};const guides={NotebookLM:{url:'https://notebooklm.google.com/',steps:[['Använd ett Google-konto','NotebookLM använder ditt vanliga Google-konto.','Här väljer du Skapa konto om du inte redan har ett Google-konto.','Google\n\nLogga in\nE-post eller telefonnummer\n\nSkapa konto'],['Skapa en ny notebook','En notebook är en egen arbetsyta för ditt uppdrag.','Klicka på Skapa ny notebook. Tänk en notebook per uppdrag eller tema.','NotebookLM\n\n+ Skapa ny notebook','assets/notebook-home.png'],['Lägg till en källa','En notebook blir användbar när den får ett tydligt underlag.','Välj Ladda upp för ett dokument, eller Google Drive om materialet redan finns där.','Lägg till källor\n\nLadda upp  •  Drive  •  Klistra in','assets/notebook-workspace.png'],['Börja samtalet','Efter att källan har lästs in kan du ställa frågor.','Skriv en konkret första fråga: Vilka teman återkommer i materialet?','Notebook\n\nSkriv en fråga…','assets/notebook-workspace.png']]},Gamma:{url:'https://gamma.app/',steps:[['Starta ett nytt projekt','Logga in och välj Create new AI.','Börja med ett verkligt workshopuppdrag.','Gamma\n\nCreate new AI'],['Välj en väg in','Välj Generate, Paste eller Import.','Generate för idé, Paste för text och Import för underlag.','Generate  •  Paste  •  Import'],['Ge Gamma riktning','Skriv målgrupp, syfte, omfattning och ton.','Be först om en disposition som du kan granska.','Beskriv ditt uppdrag…'],['Granska och förädla','Kontrollera innehåll och bilder före delning.','Ändra text direkt eller använd AI-redigering.','Presentation\n\n✦ Redigera med AI']]}};const $=x=>document.getElementById(x),tour=$('tour');let g,i;function renderTour(){let s=g.steps[i];$('count').textContent=`Steg ${i+1} av ${g.steps.length}`;$('title').textContent=s[0];$('copy').textContent=s[1];$('bubble').textContent=s[2];const hasImage=Boolean(s[4]);$('mock').parentElement.style.padding=hasImage?'0':'40px';$('mock').style.cssText=hasImage?'width:100%;height:100%;padding:0;background:transparent;box-shadow:none;':'';$('mock').innerHTML=s[4]?'<img src="'+s[4]+'" alt="NotebookLM-vy" style="display:block;width:100%;height:100%;object-fit:cover;object-position:center">':s[3];$('back').disabled=!i;$('next').hidden=i===g.steps.length-1;$('open').href=g.url;$('open').className=i===g.steps.length-1?'primary last':'primary'}function openGuide(name){g=guides[name];i=0;renderTour();tour.showModal()}function card(x,tool){let guide=guides[x[0]]?'<button data-guide="'+x[0]+'">Guide</button>':'';let isPlanner=!tool&&x[5]==='planner', image=!tool&&x[4]?'<img src="'+x[4]+'" alt="">':'', logo=tool&&x[5]?'<img class="tool-logo" src="'+x[5]+'" alt="'+x[0]+'-logotyp">':'';let classes='card '+(tool?x[0].toLowerCase().replace('chatgpt','openai').replace('elevenlabs','eleven'):'') ;return '<article class="'+classes+'" style="--c:'+x[3]+'"><div class="thumb '+(!tool?'app-thumb ':'')+(isPlanner?'planner-art':'')+'">'+(image||logo||(!isPlanner?'<b>'+(x[4]||x[0])+'</b>':''))+'</div><h2>'+x[0]+'</h2><p>'+x[1]+'</p><div class="actions">'+guide+'<a class="open" href="'+x[2]+'" target="_blank">Öppna ↗</a></div></article>'}$('tools').querySelector('.grid').innerHTML=data.tools.map(x=>card(x,true)).join('');$('apps').querySelector('.grid').innerHTML=data.apps.map(x=>card(x,false)).join('');document.querySelectorAll('[data-guide]').forEach(b=>b.onclick=()=>openGuide(b.dataset.guide));$('close').onclick=()=>tour.close();$('back').onclick=()=>{if(i){i--;renderTour()}};$('next').onclick=()=>{if(i<g.steps.length-1){i++;renderTour()}};document.querySelectorAll('.tabs button').forEach((b,n)=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach((x,k)=>x.setAttribute('aria-selected',k===n));$('tools').hidden=n;$('apps').hidden=!n});
</script></body></html>
