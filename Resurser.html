<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-verktyg och appar</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Raleway:wght@500;600&display=swap" rel="stylesheet"><style>
:root{font-family:Raleway,Arial,sans-serif;color:#35212d;background:#f8eee9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 78% 12%,#fde1ec,transparent 28%),linear-gradient(135deg,#fffaf6,#f8ece5)}main{max-width:1680px;min-height:100vh;margin:auto;padding:clamp(20px,3vw,42px) clamp(24px,6vw,100px)}.tabs{display:flex;justify-content:center;gap:8px;margin:0 0 34px}.tabs button,.button{padding:10px 16px;border:1px solid #dfbfd0;border-radius:999px;background:#fff;color:#765e6b;font:700 15px Montserrat,Arial,sans-serif;cursor:pointer;text-decoration:none}.tabs button[aria-selected=true]{border-color:#bf348e;background:#bf348e;color:#fff}h1{margin:0 0 32px;text-align:center;font:700 clamp(34px,4.7vw,60px)/1 Montserrat,Arial,sans-serif;letter-spacing:-.055em}.panel[hidden]{display:none!important}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(13px,1.5vw,22px)}.card{min-height:225px;padding:clamp(15px,1.4vw,21px);border:1px solid #ead8d5;border-radius:22px;background:#fff;box-shadow:0 10px 26px #5b2c3c14}.thumb{height:clamp(78px,8vw,122px);border:1px solid #ead8d5;border-radius:15px;display:grid;place-items:center;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 42%,white));color:#fff;font:700 clamp(21px,2vw,34px)/1 Montserrat,Arial,sans-serif;text-align:center}.thumb:after{content:"";position:absolute;width:130px;height:130px;border:1px solid #ffffffa6;border-radius:50%;right:-42px;bottom:-64px}.thumb b{position:relative;z-index:1}.app-thumb{background:#f2eae4}.app-thumb img{width:100%;height:100%;object-fit:cover}.planner{background:linear-gradient(135deg,#bf348e,#f24b78 52%,#f29441)}.card h2{margin:16px 0 7px;font:700 clamp(20px,1.75vw,28px)/1.1 Montserrat,Arial,sans-serif;letter-spacing:-.04em}.card p{margin:0;min-height:42px;font-size:clamp(14px,1.08vw,18px);line-height:1.35;color:#765e6b}.actions{display:flex;gap:8px;margin-top:12px}.actions .button{padding:8px 11px;border-radius:9px;font-size:14px}.actions .open{background:var(--accent);border-color:var(--accent);color:#fff}dialog{width:min(900px,94vw);border:0;border-radius:24px;padding:0;box-shadow:0 26px 70px #21121a66;color:#35212d}dialog::backdrop{background:#35212d88}.guide-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:22px 26px;border-bottom:1px solid #ead8d5;font:700 22px Montserrat,Arial,sans-serif}.close{border:0;background:transparent;font-size:30px;cursor:pointer}.guide-body{padding:26px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.guide-step{padding:19px;border-radius:16px;background:#f8eee9}.guide-step b{color:#8063ee;font:700 13px Montserrat,Arial,sans-serif;letter-spacing:.08em}.guide-step h2{margin:8px 0;font:700 22px Montserrat,Arial,sans-serif}.guide-step p{margin:0;line-height:1.45;color:#765e6b}.guide-foot{padding:0 26px 26px}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){main{padding:30px 20px}.grid,.guide-body{grid-template-columns:1fr}.thumb{height:125px}}
</style></head><body><main><nav class="tabs" role="tablist"><button role="tab" aria-selected="true">AI-verktyg</button><button role="tab" aria-selected="false">Mina appar</button></nav><section id="tools" class="panel"><h1>AI-verktyg</h1><div class="grid"></div></section><section id="apps" class="panel" hidden><h1>Mina appar</h1><div class="grid"></div></section></main><dialog id="guide"><div class="guide-head"><span id="guide-title"></span><button class="close" aria-label="Stäng">×</button></div><div class="guide-body" id="guide-body"></div><div class="guide-foot"><a class="button open" id="guide-open" target="_blank" rel="noopener noreferrer">Öppna ↗</a></div></dialog><script>
const fallback={tools:[{name:'ChatGPT',description:'Idéer, utkast, analys och återkoppling.',url:'https://chatgpt.com/',accent:'#18a989',mark:'◎'},{name:'Claude',description:'Resonera, skriva och arbeta med längre underlag.',url:'https://claude.ai/',accent:'#df7e5d',mark:'Claude'},{name:'Gamma',description:'Skapa presentationer och visuella berättelser.',url:'https://gamma.app/',accent:'#8063ee',mark:'G'},{name:'NotebookLM',description:'Utforska egna källor, dokument och frågor.',url:'https://notebooklm.google.com/',accent:'#2b78d0',mark:'NotebookLM'},{name:'Consensus',description:'Sök och orientera dig i forskning.',url:'https://consensus.app/',accent:'#c53591',mark:'⌁'},{name:'ElevenLabs',description:'Röst, tal och ljud från text.',url:'https://elevenlabs.io/',accent:'#161616',mark:'Ⅱ'},{name:'Lovable',description:'Skapa enkla digitala lösningar genom dialog.',url:'https://lovable.dev/',accent:'#ff6945',mark:'♥'}],apps:[{name:'Programplaneraren',description:'Planera, visa och samla material för en workshop.',url:'https://tringenr.github.io/ai-workshop-programplanerare/Workshopprogram.html',accent:'#bf348e'},{name:'Skolplanering',description:'Synkade kalendrar och planeringar för barnens skolgång.',url:'https://tringenr.github.io/Skolplanering/',image:'assets/skolplanering-thumb.png',accent:'#18a989'},{name:'Bokhyllan',description:'En egen app för att utforska och organisera böcker.',url:'https://tringenr.github.io/bokhyllan/',image:'assets/bokhyllan-thumb.png',accent:'#bf348e'},{name:'Bilkalkylen',description:'En enkel kalkyl för att jämföra bilkostnader.',url:'https://tringenr.github.io/bilkalkylen/',image:'assets/bilkalkylen-thumb.png',accent:'#f29441'},{name:'Beteendeguide',description:'Lära sig TBA',url:'https://tringenr.github.io/beteendeguide/',accent:'#bf348e',mark:'●'}]};const guides={Gamma:{url:'https://gamma.app/',steps:[['Starta nytt','Logga in och välj Create new AI.'],['Välj väg','Generate för en ny idé, Paste för befintlig text eller Import för ett dokument.'],['Ge riktning','Skriv målgrupp, syfte, omfattning och ton.'],['Förädla','Granska innehåll och bilder före delning.']]},NotebookLM:{url:'https://notebooklm.google.com/',steps:[['Logga in','Öppna NotebookLM med ett Google-konto.'],['Skapa notebook','Välj Skapa ny för ett uppdrag eller tema.'],['Lägg till källor','Ladda upp material, välj från Drive eller klistra in text.'],['Ställ frågor','Be om sammanfattning, teman eller olika perspektiv och kontrollera mot källorna.']]}};const esc=v=>String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');const guide=document.getElementById('guide');function openGuide(name){const g=guides[name];document.getElementById('guide-title').textContent='Kom igång med '+name;document.getElementById('guide-open').href=g.url;document.getElementById('guide-body').innerHTML=g.steps.map((s,i)=>`<section class="guide-step"><b>0${i+1}</b><h2>${esc(s[0])}</h2><p>${esc(s[1])}</p></section>`).join('');guide.showModal()}function toolCard(x){const guided=guides[x.name];return `<article class="card" style="--accent:${esc(x.accent)}"><div class="thumb"><b>${esc(x.mark)}</b></div><h2>${esc(x.name)}</h2><p>${esc(x.description)}</p><div class="actions">${guided?`<button class="button" data-guide="${x.name}">Guide</button>`:''}<a class="button open" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Öppna ↗</a></div></article>`}function appCard(x){const content=x.image?`<img src="${esc(x.image)}" alt="">`:`<b>${esc(x.mark||x.name)}</b>`;return `<a class="card" style="--accent:${esc(x.accent)}" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer"><div class="thumb app-thumb ${x.name==='Programplaneraren'?'planner':''}">${content}</div><h2>${esc(x.name)}</h2><p>${esc(x.description)}</p><div class="actions"><span class="button open">Öppna ↗</span></div></a>`}function render(data){document.querySelector('#tools .grid').innerHTML=data.tools.map(toolCard).join('');document.querySelector('#apps .grid').innerHTML=data.apps.map(appCard).join('');document.querySelectorAll('[data-guide]').forEach(button=>button.onclick=()=>openGuide(button.dataset.guide))}fetch('resources.json').then(r=>r.ok?r.json():Promise.reject()).then(render).catch(()=>render(fallback));document.querySelector('.close').onclick=()=>guide.close();guide.addEventListener('click',e=>{if(e.target===guide)guide.close()});const tabs=[...document.querySelectorAll('[role=tab]')],tools=document.getElementById('tools'),apps=document.getElementById('apps');tabs.forEach((tab,i)=>tab.onclick=()=>{tabs.forEach((x,n)=>x.setAttribute('aria-selected',String(n===i)));tools.hidden=i===1;apps.hidden=i===0;window.scrollTo(0,0)});
</script></body></html>
