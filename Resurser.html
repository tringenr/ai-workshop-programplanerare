<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-verktyg och appar</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Raleway:wght@500;600&display=swap" rel="stylesheet"><style>
:root{color:#35212d;background:#f8eee9;font-family:Raleway,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 78% 12%,#fde1ec 0,transparent 28%),linear-gradient(135deg,#fffaf6,#f8ece5)}main{max-width:1680px;min-height:100vh;margin:auto;padding:clamp(20px,3.2vw,42px) clamp(24px,6vw,100px)}.tabs{display:flex;justify-content:center;gap:8px;margin:0 0 clamp(22px,3vw,36px)}.tabs button{padding:10px 16px;border:1px solid #dfbfd0;border-radius:999px;background:#fff;color:#765e6b;font:700 15px Montserrat,Arial,sans-serif;cursor:pointer}.tabs button[aria-selected=true]{border-color:#bf348e;background:#bf348e;color:#fff}h1{margin:0 0 clamp(20px,3vw,36px);text-align:center;font:700 clamp(34px,4.7vw,60px)/1 Montserrat,Arial,sans-serif;letter-spacing:-.055em}.panel[hidden]{display:none!important}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(13px,1.5vw,22px)}.card{display:block;min-height:225px;padding:clamp(15px,1.4vw,21px);border:1px solid #ead8d5;border-radius:22px;background:#fff;color:#35212d;text-decoration:none;box-shadow:0 10px 26px rgba(91,44,60,.08);transition:transform .2s ease,box-shadow .2s ease}.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 19px 38px rgba(91,44,60,.17);outline:3px solid #bf348e33}.thumb{height:clamp(78px,8vw,122px);border:1px solid #ead8d5;border-radius:15px;display:grid;place-items:center;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 42%,white));color:#fff;font:700 clamp(21px,2vw,34px)/1 Montserrat,Arial,sans-serif;text-align:center}.thumb:after{content:"";position:absolute;width:130px;height:130px;border:1px solid #ffffffa6;border-radius:50%;right:-42px;bottom:-64px}.thumb b{position:relative;z-index:1}.card h2{margin:16px 0 7px;font:700 clamp(20px,1.75vw,28px)/1.1 Montserrat,Arial,sans-serif;letter-spacing:-.04em}.card p{margin:0;min-height:42px;font-size:clamp(14px,1.08vw,18px);line-height:1.35;color:#765e6b}.card small{display:block;margin-top:11px;color:var(--accent,#bf348e);font:700 15px Montserrat,Arial,sans-serif}.app-thumb{background:#f2eae4}.app-thumb img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}.planner-art{position:relative;background:linear-gradient(135deg,#bf348e,#f24b78 52%,#f29441)}.planner-art:before{content:"";position:absolute;inset:14% 16%;border-radius:12px;background:rgba(255,255,255,.94);box-shadow:0 12px 26px rgba(53,33,45,.28)}.planner-art:after{content:"";position:absolute;left:27%;right:27%;top:29%;height:8px;border-radius:8px;background:#bf348e;box-shadow:0 26px 0 #f29441,0 52px 0 #f24b78}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-height:245px}}@media(max-width:600px){main{padding:30px 20px}.grid{grid-template-columns:1fr}.card{min-height:220px}.thumb{height:125px}}
</style></head><body><main><nav class="tabs" role="tablist" aria-label="Resurser"><button type="button" role="tab" aria-selected="true">AI-verktyg</button><button type="button" role="tab" aria-selected="false">Mina appar</button></nav><section id="tools" class="panel" role="tabpanel"><h1>AI-verktyg</h1><div class="grid"></div></section><section id="apps" class="panel" role="tabpanel" hidden><h1>Mina appar</h1><div class="grid"></div></section></main><script>
const esc=v=>String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');const card=(x,app)=>{const img=app&&x.image?`<img src="${esc(x.image)}" alt="">`:'';const planner=app&&!x.image&&x.name==='Programplaneraren';return `<a class="card" style="--accent:${esc(x.accent||'#bf348e')}" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer"><div class="thumb ${app?'app-thumb':''} ${planner?'planner-art':''}">${img||`<b>${esc(x.mark||x.name)}</b>`}</div><h2>${esc(x.name)}</h2><p>${esc(x.description)}</p><small>Öppna ↗</small></a>`};fetch('resources.json').then(r=>r.json()).then(data=>{document.querySelector('#tools .grid').innerHTML=data.tools.map(x=>card(x,false)).join('');document.querySelector('#apps .grid').innerHTML=data.apps.map(x=>card(x,true)).join('')}).catch(()=>{document.querySelector('#tools .grid').textContent='Resurserna kunde inte läsas in.'});const tabs=[...document.querySelectorAll('[role="tab"]')],tools=document.getElementById('tools'),apps=document.getElementById('apps');tabs.forEach((tab,i)=>tab.onclick=()=>{tabs.forEach((x,n)=>x.setAttribute('aria-selected',String(n===i)));tools.hidden=i===1;apps.hidden=i===0;window.scrollTo(0,0)});
</script></body></html>
